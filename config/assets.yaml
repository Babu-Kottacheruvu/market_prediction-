# Phase 1 MVP assets. Everything listed in markets.yaml is addressable,
# these are the ones enabled by default in the UI and covered by CI.
mvp:
  - market: crypto
    symbol: BTCUSDT
  - market: forex
    symbol: EURUSD
  - market: commodities
    symbol: XAUUSD

mvp_timeframes: [1m, 5m, 15m, 1h]

enabled_timeframes: [1m, 3m, 5m, 15m, 30m, 1h, 4h, 1d]
